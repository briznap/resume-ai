# Nginx config for the frontend container (static React build + API proxy).
# Wired in by docker/frontend.Dockerfile as a *template*:
#   COPY docker/nginx.conf /etc/nginx/templates/default.conf.template
# The nginx image renders it into /etc/nginx/conf.d/default.conf at startup,
# substituting only ${PANGOLIN_*} variables (NGINX_ENVSUBST_FILTER) — nginx's
# own $variables below are left untouched.
#
# The backend has no published ports — it is only reachable through this proxy
# over the internal Docker network (service name `backend`).

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ── Real client IP ──
    # Pangolin (Traefik) connects from the `pangolin` Docker network and appends
    # the client address it saw to X-Forwarded-For. Trust that header only when
    # the connection comes from that network, and take only the LAST entry (the
    # one Pangolin wrote) — anything to its left was supplied by the client and
    # is spoofable. $remote_addr then holds the real client IP.
    set_real_ip_from ${PANGOLIN_SUBNET};
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Proxy API calls to the backend container. No trailing slash on proxy_pass
    # so the full "/api/..." path is forwarded unchanged. X-Forwarded-For is
    # *replaced* (not appended) with the single resolved client IP, so the
    # backend never sees client-supplied values. The backend's security headers
    # come through on these responses, so the nginx header set isn't added here.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check also lives on the backend.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache fingerprinted build assets.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing catch-all: serve index.html for any path that isn't a
    # real file, so deep links like /about and /under-the-hood work on reload.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
