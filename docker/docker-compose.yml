# Production stack: Nginx-served frontend + FastAPI backend on an internal
# network. Neither service publishes ports — the frontend is fronted by Pangolin
# in production, and the backend is only reachable via the frontend's /api proxy.
#
# Paths: build contexts are the repo root (..); volume/env paths are relative to
# this file's directory (docker/), hence the ../ prefixes.

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    # No published ports: Pangolin reaches this container by name over the
    # external `pangolin` Docker network. (docker-compose.dev.yml publishes
    # ports for local testing only, bound to 127.0.0.1.)
    environment:
      # CIDR of the external `pangolin` network. Nginx trusts X-Forwarded-For
      # only from this range (see docker/nginx.conf). Required — find it with:
      #   docker network inspect pangolin -f '{{range .IPAM.Config}}{{.Subnet}} {{end}}'
      # and set it in docker/.env (gitignored) or the shell environment.
      PANGOLIN_SUBNET: ${PANGOLIN_SUBNET:?set PANGOLIN_SUBNET to the pangolin network CIDR}
    depends_on:
      - backend
    networks:
      app-network:
        # Fixed address: the backend trusts X-Forwarded-For from this IP only.
        ipv4_address: 10.213.47.2
      pangolin: {}

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    # Pin the in-container file paths. `environment` overrides any values in
    # env_file, so a local-dev RESUME_PATH/AGENT_CONTEXT_PATH (e.g. ../) in
    # .env won't break the container, where the volumes mount at /app/...
    environment:
      RESUME_PATH: /app/resume.json
      AGENT_CONTEXT_PATH: /app/agent-context.md
      LOG_PATH: /app/logs/resume-ai.log
      SIGNIN_DB_PATH: /app/data/signins.db
      # uvicorn honors X-Forwarded-For only from the frontend (Nginx) container,
      # which has already reduced it to the single real client IP.
      FORWARDED_ALLOW_IPS: 10.213.47.2
    volumes:
      - ../resume.json:/app/resume.json:ro
      - ../agent-context.md:/app/agent-context.md:ro
      # Writable (no :ro): structured JSON event log, rotated by the app.
      # The container runs as uid 1001 — ../logs on the host must be writable
      # by that uid or logging falls back to the console log.
      - ../logs:/app/logs
      # Writable (no :ro): SQLite sign-in tracking DB (+ its -wal/-shm sidecars).
      # Same uid 1001 caveat — ../data on the host must be writable by that uid,
      # or sign-in DB writes are logged-and-skipped. Persists across rebuilds.
      - ../data:/app/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    # Pinned so the frontend can hold a fixed address (FORWARDED_ALLOW_IPS).
    # Dynamic allocation (the backend) is confined to the upper half so it
    # never collides with the frontend's static .2.
    ipam:
      config:
        - subnet: 10.213.47.0/28
          ip_range: 10.213.47.8/29
  pangolin:
    external: true