# Security headers for responses nginx serves itself (the SPA shell + assets).
# Same set as backend/middleware/security_headers.py, which stamps the /api and
# /health responses — so this is included only in the static locations, never
# the proxied ones (that would duplicate every header).
#
# Included per-location rather than at server level because nginx drops all
# inherited add_header directives in any location that declares its own (e.g.
# Cache-Control on /assets/). `always` keeps them on 4xx/5xx responses too.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
